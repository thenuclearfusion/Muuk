<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUUK' – hábitos</title>
<style>
:root{--bg:#f7ecd6;--card:#fffaf0;--ink:#3a2412;--mut:#7d6446;--gold:#e0a020;--acc:#c8561e;--ok:#3f7d3a;--bad:#a8321e;--line:#e6d2a8;--hero:#f3c96b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1420;--card:#2e2030;--ink:#f6e6c8;--mut:#b99f82;--gold:#f0b43a;--acc:#ff8a3d;--ok:#8ccf7e;--bad:#ff7a63;--line:#4a3550;--hero:#5a2f3a}}
:root[data-theme="dark"]{--bg:#1e1420;--card:#2e2030;--ink:#f6e6c8;--mut:#b99f82;--gold:#f0b43a;--acc:#ff8a3d;--ok:#8ccf7e;--bad:#ff7a63;--line:#4a3550;--hero:#5a2f3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;max-width:520px;margin-inline:auto;padding-bottom:90px}
h1,h2,.big{font-family:Georgia,"Times New Roman",serif}
.hero{background:linear-gradient(180deg,var(--hero),var(--bg));padding:18px 16px 8px;text-align:center}
.hero svg{width:200px;height:200px;max-width:60vw}
.bounce{animation:b .6s}
@keyframes b{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px) scale(1.04)}60%{transform:translateY(0) scale(.98)}}
.aura{transform-box:fill-box;transform-origin:center;animation:au 2.6s ease-in-out infinite}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk 1.4s ease-in-out infinite}
@keyframes au{50%{transform:scale(1.07);opacity:.8}}@keyframes fk{50%{transform:scaleY(1.12)}}
@media (prefers-reduced-motion:reduce){.bounce,.aura,.fl{animation:none}}
.stage{font-family:Georgia,serif;font-size:26px;margin:4px 0 0}
.sub{color:var(--mut);margin:0 0 10px;font-size:14px}
.bar{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 24px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--acc));transition:width .5s}
.stats{display:flex;gap:8px;padding:10px 16px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;font-family:Georgia,serif}
.stat span{font-size:12px;color:var(--mut)}
h2{font-size:19px;margin:14px 16px 6px}
.list{padding:0 16px;display:grid;gap:8px}
.h{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.h .e{font-size:26px}
.h .n{flex:1;font-weight:600}
.h .n small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.h.done{border-color:var(--ok)}.h.fail{border-color:var(--bad)}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{background:var(--ok);border-color:var(--ok);color:#fff}
.no{border-color:var(--bad);color:var(--bad)}
.on{background:var(--ok);border-color:var(--ok);color:#fff}
.offb{background:var(--bad);border-color:var(--bad);color:#fff}
.x{border:0;color:var(--mut);padding:4px 8px;min-height:32px;font-size:18px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:30px;padding:0 22px;min-height:54px;font-weight:700;box-shadow:0 4px 14px #0004}
.panel{margin:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:none;gap:8px}
.panel.open{display:grid}
input,select{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;gap:8px}.row input:first-child{width:70px;text-align:center}
.empty{color:var(--mut);padding:8px 16px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;max-width:520px;margin-inline:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
.ov[hidden]{display:none}
.ov{--bg:#e4f1ee;--card:#f7fbfa;--ink:#23424a;--mut:#5b7b80;--line:#bcd7d6;--acc:#3d8f93;--ok:#3d8f93;background:linear-gradient(#e4f1ee,#d8e6f3)}
@media (prefers-color-scheme:dark){.ov{--bg:#16292f;--card:#1f3a42;--ink:#e3f1ee;--mut:#9dbcc0;--line:#35545c;--acc:#7fd0cf;--ok:#3d8f93;background:linear-gradient(#16292f,#1b2a40)}}
.sw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.sw button[style]{width:44px;padding:0;border-radius:50%}.mb input{text-align:center}.mb .sw button{min-height:44px}
.mb{text-align:center;display:grid;gap:12px;padding-top:24px}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.anim .mb>*{animation:in .5s ease both}.anim .mb>*:nth-child(2){animation-delay:.07s}.anim .mb>*:nth-child(3){animation-delay:.14s}.anim .mb>*:nth-child(n+4){animation-delay:.21s}}.mb svg{width:180px;height:180px}.ma{font-size:64px}.mb h1{margin:0;font-size:38px}.mb p{margin:0}
.scene{background:linear-gradient(#bfe6ff 0 42%,#7cc35a 42%);border-radius:16px;padding:16px;display:flex;flex-wrap:wrap;justify-content:space-around;align-items:end;min-height:280px;overflow:hidden}
.scene svg{width:120px;height:120px}.scene .sub{color:#2d4a1c}
.wander{animation:wd 6s ease-in-out infinite alternate;text-align:center}@keyframes wd{to{transform:translateX(40px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.grid svg{width:110px;height:110px}.lock svg{filter:brightness(0);opacity:.2}
@media (prefers-reduced-motion:reduce){.wander{animation:none}}
.quote{margin:12px 22px 0;text-align:center;font-family:Georgia,serif;font-style:italic;color:var(--mut);min-height:48px;transition:opacity .6s}.quote.out{opacity:0}
.farm{position:relative;height:320px;border-radius:18px;overflow:hidden;background:linear-gradient(#bfe6ff 0 38%,#9fd67c 38% 100%)}
.farm .hill{position:absolute;left:-10%;right:-10%;top:30%;height:60px;background:#8fcf6c;border-radius:50% 50% 0 0}
.farm .fence{position:absolute;left:0;right:0;top:41%;height:22px;background:repeating-linear-gradient(90deg,#a9774a 0 6px,transparent 6px 26px);border-top:4px solid #a9774a}
.farm .sun{position:absolute;right:14px;top:10px;font-size:34px}.farm .cl{position:absolute;top:18px;font-size:30px;animation:cl 40s linear infinite}
@keyframes cl{from{left:-15%}to{left:105%}}
.farm .an{position:absolute;width:84px;background:none;border:0;padding:0;min-height:0;cursor:pointer;animation:walk 10s ease-in-out infinite}
.farm .an svg{width:84px;height:84px}.hp{animation:hop 1.1s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(var(--d)) scaleX(1)}52%{transform:translateX(var(--d)) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.rg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.rn{aspect-ratio:1;min-height:0;padding:0;font-size:26px;border-radius:14px;color:#fff;border:2px solid #0003;font-family:Georgia,serif;transition:transform .15s}.rn.sl{outline:4px solid var(--acc);transform:scale(1.08)}
@keyframes hop{50%{transform:translateY(-9px)}}
@keyframes honin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.hon{position:fixed;inset:0;z-index:30;display:grid;align-content:center;justify-items:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(#3a1d12,#14090a);color:#fff3d6;animation:honin 1s ease both;overflow:auto}
.hon svg{width:150px;height:150px}.hon h1{font-family:Georgia,serif;font-size:clamp(30px,9vw,46px);line-height:1.15;margin:0}.hon p{margin:0;opacity:.85;font-size:18px}
.hon .bt{display:grid;gap:10px;width:min(340px,100%);animation:honin 1s 2.5s ease both}.hon button{color:#fff3d6;border-color:#a9774a}.hon .go{background:#e0a020;border-color:#e0a020;color:#2a1710;font-weight:700}
.rg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:manipulation}.rg button{aspect-ratio:1;min-height:0;padding:0;border-radius:12px;border:2px solid transparent;font-size:clamp(16px,6vw,26px);color:#fff;font-weight:700;transition:transform .15s}.rg .sel{outline:4px solid #fff;transform:scale(1.12);z-index:1;position:relative}
.mg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;touch-action:manipulation}.mg button{aspect-ratio:1;min-height:0;padding:0;border-radius:10px;border:0;background:linear-gradient(#8fa6b0,#667f8c);font-weight:800;font-size:clamp(14px,5vw,22px)}.mg .ro{background:var(--card);border:1px solid var(--line)}
.dr{position:relative;display:inline-block;line-height:1}.dr svg{display:block}.dr .ht{position:absolute;left:50%;top:6%;transform:translateX(-50%)}.dr .am{position:absolute;right:4%;bottom:10%;font-size:.9em}.rg .bomb{box-shadow:0 0 0 3px #fff9,0 0 12px 4px #ffd54a}
@media (prefers-reduced-motion:reduce){.farm .an,.hp,.farm .cl{animation:none}}
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<div class="hero"><button class="x" id="mbtn" aria-label="Menú" style="float:left;font-size:24px">☰</button>
  <div id="lion"></div>
  <p class="stage" id="stage"></p>
  <p class="sub" id="sub"></p>
  <div class="bar"><i id="fill"></i></div>
  <button class="go" id="nextpet" hidden style="margin:8px 0"></button>
</div>
<div class="stats">
  <div class="stat"><b id="lvl">1</b><span>Nivel</span></div>
  <div class="stat"><b id="xp">0</b><span>Puntos</span></div>
  <div class="stat"><b id="streak">0</b><span>Días de racha</span></div>
</div>
<p class="quote" id="qt"></p>
<h2>Hábitos buenos</h2><div class="list" id="good"></div>
<h2>Hábitos que quiero dejar</h2><div class="list" id="bad"></div>
<div class="empty" id="sync">Progreso guardado en este dispositivo</div>
<div class="panel" id="panel">
  <div class="row"><input id="emo" value="⭐" maxlength="2" aria-label="Emoji"><input id="name" placeholder="Nombre del hábito" aria-label="Nombre"></div>
  <select id="type" aria-label="Tipo"><option value="good">Hábito bueno (+10 puntos)</option><option value="bad">Hábito a dejar (+10 si resisto, −5 si caigo)</option></select>
  <button class="go" id="add">Agregar hábito</button>
</div>
<button class="fab" id="fab">+ Nuevo hábito</button>
<script>
const KEY="melena-v1";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayN=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.habits)S={habits:[
 {id:1,e:"💧",n:"Vaso de agua",t:"good",log:{}},
 {id:2,e:"📖",n:"Leer 10 minutos",t:"good",log:{}},
 {id:3,e:"🏃",n:"Ejercicio",t:"good",log:{}},
 {id:4,e:"🍬",n:"Dejar los dulces",t:"bad",log:{}},
 {id:5,e:"📱",n:"Menos redes sociales",t:"bad",log:{}}]};
S.pet=S.pet||'phoenix';S.owned=S.owned||[];S.base=S.base||0;
let cloud=null;
const save=()=>{S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(cloud){clearTimeout(save.t);save.t=setTimeout(()=>{cloud.set(JSON.parse(JSON.stringify(S))).then(()=>say('Progreso guardado en la nube ☁️')).catch(()=>{})},800)}};
const say=m=>{const e=document.getElementById('sync');if(e)e.textContent=m};
let STAGES=[{n:"Huevo",at:0},{n:"Cría",at:10},{n:"Fénix joven",at:60},{n:"Fénix adolescente",at:150},{n:"Fénix adulto",at:300},{n:"Fénix grande",at:600}];
const PS=STAGES.slice(),LS=[{n:'Cachorro',at:0},{n:'Leoncito joven',at:100},{n:'León de melena',at:300},{n:'Rey de la sabana',at:700}];
const FS=[{n:'Cría de zorro',at:0},{n:'Zorro joven',at:80},{n:'Zorro astuto',at:200},{n:'Zorro legendario',at:450}],OS=[{n:'Polluelo',at:0},{n:'Búho joven',at:80},{n:'Búho sabio',at:200},{n:'Búho de la sabiduría',at:450}];
const ANIMALS={phoenix:{n:'Fénix',st:PS,draw:phoenix},lion:{n:'León',st:LS,draw:lionV1},fox:{n:'Zorro',st:FS,draw:s=>critter('fox',s)},owl:{n:'Búho',st:OS,draw:s=>critter('owl',s)}};
function petXP(){return Math.max(0,totalXP()-(S.base||0))}
function art(k,st){const o=STAGES;STAGES=ANIMALS[k].st;const s=ANIMALS[k].draw(st);STAGES=o;return s}
function curStage(){let st=0;ANIMALS[S.pet].st.forEach((s,i)=>{if(petXP()>=s.at)st=i});return st}
function checkDone(st){const top=st===STAGES.length-1;
 if(top&&!S.owned.includes(S.pet)){S.owned.push(S.pet);save();0}
 const left=Object.keys(ANIMALS).filter(k=>!S.owned.includes(k)),b=document.getElementById('nextpet');
 b.hidden=!(top&&S.owned.includes(S.pet));b.textContent=left.length?'Elegir nuevo huevo 🥚':'¡Los tienes todos! Ver granja 🏡'}
function totalXP(){let x=0;S.habits.forEach(h=>Object.values(h.log).forEach(v=>x+=v==="ok"?(h.p||10):-Math.ceil((h.p||10)/2)));return Math.max(0,x+(S.bonus||0))}
function streak(){const days=new Set();S.habits.forEach(h=>Object.entries(h.log).forEach(([d,v])=>{if(v==="ok")days.add(dayN(d))}));
 let c=dayN(today());if(!days.has(c))c--;let n=0;while(days.has(c)){n++;c--}return n}
const PD=`<defs><linearGradient id='gb' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ffb02e'/><stop offset='1' stop-color='#e8431a'/></linearGradient><linearGradient id='gw' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ffd54a'/><stop offset='.6' stop-color='#ff7a1a'/><stop offset='1' stop-color='#d62f1a'/></linearGradient><linearGradient id='gt' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ffd54a'/><stop offset='.5' stop-color='#ff7a1a'/><stop offset='1' stop-color='#d62f1a' stop-opacity='.25'/></linearGradient><radialGradient id='gl'><stop offset='0' stop-color='#ffd54a' stop-opacity='.75'/><stop offset='1' stop-color='#ff8a1a' stop-opacity='0'/></radialGradient><radialGradient id='ge' cx='.35' cy='.3'><stop offset='0' stop-color='#fff6e6'/><stop offset='1' stop-color='#ffc58a'/></radialGradient></defs>`;
function phoenix(st){
 let o=`<svg viewBox='0 0 200 200' role='img' aria-label='Tu fénix: ${STAGES[st].n}'>${PD}`;
 if(st===0){
  o+=`<ellipse cx='100' cy='176' rx='64' ry='16' fill='#6b3d1c'/>`;
  for(let k=0;k<12;k++)o+=`<path d='M${40+k*10} 176q${k%2?6:-6} -10 ${k%2?14:-14} -4' stroke='#a86a32' stroke-width='3' fill='none' stroke-linecap='round'/>`;
  [[52,1],[148,1],[72,.7],[128,.7]].forEach(f=>{o+=`<g transform='translate(${f[0]} 172) scale(${f[1]}) translate(${-f[0]} -172)'><path class='fl' d='M${f[0]} 172q-14-18-2-42q4 14 12 22q8 8-2 20z' fill='url(#gt)'/></g>`});
  o+=`<ellipse cx='100' cy='126' rx='34' ry='46' fill='url(#ge)' stroke='#f0a060' stroke-width='2'/><g fill='#f08a5a'><circle cx='90' cy='112' r='6'/><circle cx='113' cy='128' r='7'/><circle cx='96' cy='148' r='5'/><circle cx='114' cy='104' r='4'/></g><ellipse cx='88' cy='104' rx='6' ry='12' fill='#fff' opacity='.55' transform='rotate(20 88 104)'/>`;
  return o+'</svg>'}
 const L=[0,22,36,50,64,78][st],N=[0,3,4,5,6,7][st],T=[0,0,18,32,46,60][st],K=[1,.78,.86,.94,1,1.04][st];
 if(st>=4)o+=`<circle class='aura' cx='100' cy='112' r='${st===5?98:82}' fill='url(#gl)'/>`;
 o+=`<g transform='translate(100 120) scale(${K}) translate(-100 -120)'>`;
 if(T){const m=st>=4?3:2;for(let i=-m;i<=m;i++){const x=100+i*(st>=4?16:14),h=T-Math.abs(i)*5;o+=`<path d='M100 138Q${x-8} ${148+h*.5} ${x} ${150+h}Q${x+8} ${148+h*.5} 100 138z' fill='url(#gt)'/>`}}else o+=`<path d='M92 146l8 14 8-14z' fill='url(#gt)'/>`;
 const wg=()=>{let s='';for(let i=N-1;i>=0;i--){const len=L*(1-.07*i),ang=-(st>=3?12:25)-i*(st>=3?13:15);s+=`<ellipse cx='0' cy='${-len/2}' rx='${6+L/12}' ry='${len/2}' transform='translate(84 120) rotate(${ang})' fill='url(#gw)' stroke='#c9331a' stroke-width='.8'/>`}return s};
 o+=wg()+`<g transform='translate(200 0) scale(-1 1)'>${wg()}</g>`;
 o+=`<path d='M90 150v9m-4 0h8M110 150v9m-4 0h8' stroke='#b86a00' stroke-width='3' stroke-linecap='round'/><ellipse cx='100' cy='122' rx='${st===1?32:27}' ry='${st===1?30:32}' fill='url(#gb)'/><ellipse cx='100' cy='130' rx='15' ry='20' fill='#ffe08a'/>`;
 const n=st===1?1:st<4?3:5;
 for(let j=0;j<n;j++){const x=100+(j-(n-1)/2)*9,u=(st>3?8:0)+(j%2)*6;o+=`<path d='M${x-4} 70Q${x-8} ${56-u} ${x+3} ${48-u}Q${x+6} 60 ${x+4} 70z' fill='url(#gw)'/>`}
 o+=`<circle cx='100' cy='88' r='${st===1?27:23}' fill='url(#gb)'/>`;
 if(st===1)o+=`<circle cx='80' cy='95' r='5' fill='#ff6a6a' opacity='.6'/><circle cx='120' cy='95' r='5' fill='#ff6a6a' opacity='.6'/>`;
 o+=`<ellipse cx='91' cy='84' rx='4.8' ry='${st>=3?4:5.5}' fill='#2a1710'/><ellipse cx='109' cy='84' rx='4.8' ry='${st>=3?4:5.5}' fill='#2a1710'/><circle cx='92.5' cy='82.5' r='1.7' fill='#fff'/><circle cx='110.5' cy='82.5' r='1.7' fill='#fff'/><path d='M94 91h12l-6 6z' fill='#ffc93a' stroke='#b86a00' stroke-width='1.2'/><path d='M95 95h10l-5 7z' fill='#f59a1a' stroke='#b86a00' stroke-width='1.2'/></g>`;
 [[30,60],[170,50],[40,150],[165,140],[20,100],[180,95],[60,30],[140,28]].slice(0,Math.max(0,st*2-2)).forEach(p=>o+=`<circle cx='${p[0]}' cy='${p[1]}' r='3' fill='#ffd54a'/>`);
 return o+'</svg>'}
function lionV1(st){
 let o=`<svg viewBox="0 0 200 200" role="img" aria-label="Tu fénix: ${STAGES[st].n}"><defs><radialGradient id="gl"><stop offset="0" stop-color="#ffd23f" stop-opacity=".7"/><stop offset="1" stop-color="#ff8a1a" stop-opacity="0"/></radialGradient></defs>`;
 if(st===0){
  o+=`<ellipse cx="100" cy="172" rx="62" ry="18" fill="#7a4a22"/><path d="M45 168Q100 190 155 168M52 176Q100 196 148 176" stroke="#a86a32" stroke-width="3" fill="none"/>`;
  [56,144,76,124].forEach((x,i)=>{const h=i<2?34:24;o+=`<path d="M${x} 168q-10-${h/2} 0-${h}q2 12 10 18q4 6-2 16z" fill="#ff8a1a"/><path d="M${x} 166q-4-8 0-16q2 6 5 9q2 3-1 7z" fill="#ffd23f"/>`});
  o+=`<ellipse cx="100" cy="128" rx="34" ry="44" fill="#ffe6c8" stroke="#f0a060" stroke-width="2"/><g fill="#f08a5a"><circle cx="88" cy="110" r="6"/><circle cx="112" cy="125" r="7"/><circle cx="95" cy="147" r="5"/><circle cx="114" cy="102" r="4"/></g>`;
  return o+"</svg>"}

function openRunas(){const N=7,K=5,COL=['#d6392a','#2c8fd9','#3fae4f','#d99a1a','#9b59d6'],SYM=['ᚠ','ᚢ','ᚦ','ᚱ','ᛗ'],wait=ms=>new Promise(r=>setTimeout(r,ms));
 let g=[],sel=null,score=0,moves=20,busy=false,charge=0,over=false;
 const rnd=()=>({t:Math.floor(Math.random()*K),b:false,x:0}),nb=i=>{const r=Math.floor(i/N),c=i%N,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const y=r+a,x=c+b;if(y>=0&&y<N&&x>=0&&x<N)o.push(y*N+x)}return o};
 function matches(){g.forEach(c=>{if(c)c.x=0});const set=new Set(),sp=[],runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){let e=c+1;while(e<N&&g[r*N+e].t===g[r*N+c].t)e++;if(e-c>=3)runs.push(Array.from({length:e-c},(_,k)=>r*N+c+k));c=e}}

  runs.forEach(u=>{u.forEach(i=>set.add(i));if(u.length>=4)sp.push(u[1])});
  let ch=true;while(ch){ch=false;[...set].forEach(i=>{if(g[i].b&&!g[i].x){g[i].x=1;nb(i).forEach(j=>{if(!set.has(j)){set.add(j);ch=true}})}})}
  return{set,sp}}
 function hasMove(){for(let i=0;i<N*N;i++)for(const j of [i+1,i+N]){if(j>=N*N||(j===i+1&&j%N===0))continue;[g[i],g[j]]=[g[j],g[i]];const m=matches().set.size>0;[g[i],g[j]]=[g[j],g[i]];if(m)return true}return false}

   score+=m.set.size*10*combo;charge+=m.set.size;m.sp.forEach(i=>{g[i].b=true});[...m.set].filter(i=>!m.sp.includes(i)).forEach(i=>{g[i]=null});

 function finish(){over=true;const d=today();if(!S.mg||S.mg.d!==d)S.mg={d,g:0};const pts=Math.max(0,Math.min(20-S.mg.g,Math.floor(score/150))),ru=Math.floor(score/50);S.mg.g+=pts;S.bonus=(S.bonus||0)+pts;S.runes=(S.runes||0)+ru;save();render();
  show(`<div class='mb'><div class='ma'>ᛟ</div><h2>¡Partida terminada!</h2><p>Puntaje: <b>${score}</b></p><p>+${pts} puntos · +${ru} runas ᛟ</p><p class='sub'>Los puntos del juego tienen tope de 20 al día: lo que de verdad te cambia la vida son tus hábitos. Las runas sirven para alimentar a tus animales 🍖 y para comprar sombreros y armaduras 🎩.</p><button class='go' id='again'>Jugar otra vez</button><button id='bk'>Volver al menú</button></div>`);q('#again').onclick=openRunas;q('#bk').onclick=openMenu}

 fill();draw();const gr=q('#gr');let p0=null;gr.style.touchAction='none';gr.onpointerdown=e=>{const b=e.target.closest('button');p0=b?{i:+b.dataset.i,x:e.clientX,y:e.clientY}:null};

 const hit=(ax,ay,bx,by,th,k)=>{const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((ball.x-ax)*dx+(ball.y-ay)*dy)/(dx*dx+dy*dy))),px=ax+dx*t,py=ay+dy*t;let nx=ball.x-px,ny=ball.y-py;const d=Math.hypot(nx,ny)||.01;if(d<ball.r+th){nx/=d;ny/=d;ball.x=px+nx*(ball.r+th);ball.y=py+ny*(ball.r+th);const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=1.7*vn*nx;ball.vy-=1.7*vn*ny}if(k){ball.vx+=nx*k;ball.vy+=ny*k}}};
 const tips=()=>{const a=.5-.95*fl,l=55;return{lx:95+l*Math.cos(a),ly:440+l*Math.sin(a),rx:225-l*Math.cos(a),ry:440+l*Math.sin(a)}};
 const step=()=>{pL=Object.values(pr).includes('L');pR=Object.values(pr).includes('R');const was=fl;fl=Math.max(0,Math.min(1,fl+((pL||pR)?.3:-.2)));const kick=(pL||pR)&&fl<.95?5:0;if(!ball)return;if(Math.hypot(ball.vx,ball.vy)<.4){ball.sl=(ball.sl||0)+1;if(ball.sl>150){ball.vx+=(Math.random()-.5)*5;ball.vy-=4;ball.sl=0}}else ball.sl=0;
  for(let s=0;s<3;s++){ball.vy+=.06;ball.x+=ball.vx/3;ball.y+=ball.vy/3;const sp=Math.hypot(ball.vx,ball.vy);if(sp>14){ball.vx*=14/sp;ball.vy*=14/sp}
   if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.8}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.8}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.8}
   BU.forEach((b,i)=>{const dx=ball.x-b[0],dy=ball.y-b[1],d=Math.hypot(dx,dy);if(d<b[2]+ball.r){const nx=dx/d,ny=dy/d;ball.x=b[0]+nx*(b[2]+ball.r);ball.y=b[1]+ny*(b[2]+ball.r);const v=Math.max(6,Math.hypot(ball.vx,ball.vy));ball.vx=nx*v*1.05;ball.vy=ny*v*1.05;sc+=100;flash[i]=8;tone(500+i*120,0,.1,.06,'square')}});
   hit(8,380,95,440,2,0);hit(312,380,225,440,2,0);const t=tips();hit(95,440,t.lx,t.ly,5,pL||pR?kick:0);hit(225,440,t.rx,t.ry,5,pL||pR?kick:0)}

  BU.forEach((b,i)=>{x.beginPath();x.arc(b[0],b[1],b[2],0,6.3);x.fillStyle=flash[i]>0?'#fff':['#ff3d7f','#3df0ff','#ffd23d'][i];x.fill();if(flash[i]>0)flash[i]--});
  x.strokeStyle='#7a5cff';x.lineWidth=5;x.beginPath();x.moveTo(8,380);x.lineTo(95,440);x.moveTo(312,380);x.lineTo(225,440);x.stroke();

  if(ball){x.beginPath();x.arc(ball.x,ball.y,ball.r,0,6.3);x.fillStyle='#fff';x.fill()}else if(!over){x.fillStyle='#fff';x.font='bold 16px monospace';x.textAlign='center';x.fillText('TOCA PARA LANZAR',W/2,330)}

function tysonFig(){const b="stroke='#e0361a' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'",a="stroke='#ff9a2a' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'";
